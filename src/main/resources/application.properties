#Clase 1
spring.application.name=tienda
server.port=8081

#Clase 2 
#Para definir el formato de despliegue de fecha/hora del log en la 
logging.pattern.dateformat=hh:mm

#Para eliminar mensajes invasivos de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en produccion "true"
spring.thymeleaf.cache=false

#Clase 3
#Conexión local a la BD Techshop en MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/techshop
#spring.datasource.username=root
#spring.datasource.password=14042024
#Conexión local a la BD Techshop en Aiven
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

#Clase 4
#Esta información se utiliza para obtener acceso a su storage.
firebase.bucket.name=techshop-b0f15.firebasestorage.app
firebase.storage.path=techshop
firebase.json.path=firebase
